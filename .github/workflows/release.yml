name: release

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: |
          Next release version. Possible values: x.y.z, major, minor, patch.
          Pass 'skip' to skip version bump and release the current gemspec version.
        required: true
        default: 'skip'
  repository_dispatch:
    types: [ do-release ]

permissions:
  id-token: write   # required for RubyGems trusted publishing (OIDC)
  contents: write   # required for tag push

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Configure trusted publishing (OIDC)
        uses: rubygems/configure-rubygems-credentials@v2

      - name: Compute next version
        id: bump
        run: |
          current=$(ruby -e "puts Gem::Specification.load('postsvg.gemspec').version.to_s")
          input="${{ github.event.inputs.next_version }}"
          case "$input" in
            skip)
              next="$current"
              ;;
            major|minor|patch)
              IFS='.' read -r major minor patch <<< "$current"
              case "$input" in
                major) major=$((major + 1)); minor=0; patch=0 ;;
                minor) minor=$((minor + 1)); patch=0 ;;
                patch) patch=$((patch + 1)) ;;
              esac
              next="$major.$minor.$patch"
              ;;
            *)
              next="$input"
              ;;
          esac
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Will release $next (from $current)"

      - name: Skip if no version change and 'skip' requested with already-published version
        if: steps.bump.outputs.next == steps.bump.outputs.current
        run: |
          published=$(gem list --remote --exact --version "$next" postsvg 2>/dev/null || true)
          if [ -n "$published" ]; then
            echo "::error::postsvg $next is already published and next_version=skip; nothing to do."
            exit 1
          fi

      - name: Bump version
        if: steps.bump.outputs.next != steps.bump.outputs.current
        run: |
          next="${{ steps.bump.outputs.next }}"
          sed -i -E "s/VERSION = \"[^\"]+\"/VERSION = \"$next\"/" lib/postsvg/version.rb
          cat lib/postsvg/version.rb

      - name: Build gem
        run: |
          gem build postsvg.gemspec
          ls -la *.gem

      - name: Push gem (trusted publishing OIDC)
        run: gem push postsvg-*.gem

      - name: Commit version bump + tag
        if: success()
        run: |
          next="${{ steps.bump.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/postsvg/version.rb
          git commit -m "chore: bump to v$next" || echo "No changes to commit"
          git push
          git tag "v$next"
          git push origin "v$next"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.next }}
          generate_release_notes: true
          files: postsvg-*.gem
